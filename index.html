<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мирослав | НАШЕ АВТО</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:ital,wght@1,600&family=Unbounded:wght@700&display=swap" rel="stylesheet">
   <link rel="icon" href="favicon.png" type="image/x-icon">
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    <!-- Кінець GA4 -->

    <style>
        :root {
            --orange: #ff8c00;
            --dark-bg: #0a0a0a;
            --white: #ffffff;
        }
        
        body {
            font-family: 'Manrope', sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 0%, #1f1f1f 0%, #0a0a0a 70%);
            color: var(--white);
            overflow-x: hidden;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        
        /* Анімація появи */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate { animation: fadeUp 0.8s ease-out forwards; }
        .delay-1 { animation-delay: 0.2s; opacity: 0; }
        .delay-2 { animation-delay: 0.5s; opacity: 0; }
        .delay-3 { animation-delay: 0.8s; opacity: 0; }
        .delay-4 { animation-delay: 1.1s; opacity: 0; }

        /* Логотип */
        .logo {
            width: 210px;
            margin-top: 10px;
            filter: drop-shadow(0 4px 10px rgba(255, 140, 0, 0.3));
        }

        /* Фото */
        .profile-wrapper {
            position: relative;
            display: inline-block;
            margin-top: 30px;
        }
        
        .profile {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--orange);
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.4);
        }
        
        /* Кільце, що обертається навколо фото */
        .orbit {
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border: 2px dashed rgba(255, 140, 0, 0.4);
            border-radius: 50%;
            animation: spin 12s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }

        .name {
            font-family: 'Unbounded', cursive;
            font-size: 24px;
            font-weight: 700;
            margin: 20px 0 5px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #ff9900, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Цитата */
        .quote {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 20px;
            color: #ddd;
            margin: 10px auto 25px;
            max-width: 90%;
            position: relative;
            line-height: 1.6;
        }
        
        .quote::before {
            content: '"';
            font-size: 60px;
            color: var(--orange);
            position: absolute;
            top: -30px;
            left: -20px;
            opacity: 0.5;
            font-family: serif;
        }

        /* Послуги та адреса */
        .services {
            font-size: 16px;
            font-weight: 700;
            color: var(--orange);
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .address {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 40px;
        }

        /* Кнопки */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            font-size: 18px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid transparent;
        }

        .btn:active { transform: scale(0.97); }
        
        /* Кнопка Телеграм (Основний акцент) */
        .btn-telegram {
            background: linear-gradient(45deg, #ff9900, #ff6a00);
            color: #111;
            box-shadow: 0 5px 20px rgba(255, 153, 0, 0.4);
        }
        .btn-telegram:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 153, 0, 0.6);
        }
        
        /* Кнопка Дзвінок */
        .btn-call {
            background: #ffffff;
            color: #111;
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.2);
        }
        .btn-call:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }
        
        /* Кнопка Вайбер */
        .btn-viber {
            background: transparent;
            color: #fff;
            border: 2px solid #7b519d;
        }
        .btn-viber:hover {
            background: rgba(123, 81, 157, 0.2);
            transform: translateY(-3px);
        }

        /* Кнопка Карта */
        .btn-map {
            background: transparent;
            color: #fff;
            border: 2px solid var(--orange);
        }
        .btn-map:hover {
            background: rgba(255, 140, 0, 0.15);
            transform: translateY(-3px);
        }

        /* Ефект світіння за кнопками */
        .btn-glow {
            position: relative;
            overflow: hidden;
        }
        .btn-glow::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }
        .btn-glow:hover::after {
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #444;
            letter-spacing: 1px;
        }

        /* Адаптивність (мобільна версія) */
        @media (max-width: 480px) {
            .profile { width: 150px; height: 150px; }
            .name { font-size: 22px; }
            .quote { font-size: 18px; }
            .btn { font-size: 16px; padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- Ефект помаранчевого світіння зверху -->
    <div style="position: fixed; top: -100px; left: 50%; transform: translateX(-50%); width: 100%; height: 300px; background: radial-gradient(ellipse, rgba(255, 140, 0, 0.15), transparent); z-index: 1; pointer-events: none;"></div>

    <div class="container">
        
        <img src="logo.png" class="logo animate" alt="НАШЕ АВТО">

        <div class="profile-wrapper animate delay-1">
            <div class="orbit"></div>
            <img src="profile.jpg" class="profile" alt="Миросав">
        </div>

        <div class="name animate delay-2">Мирослав</div>
        
        <div class="quote animate delay-2">
            Допоможу знайти чесне авто під твій бюджет
        </div>

        <div class="services animate delay-3">
            Продаж • Купівля • Обмін • Викуп
        </div>
        
        <div class="address animate delay-3">
            📍 Шептицький, Ст. Бандери 24А
        </div>

        <div class="btn-group animate delay-4">
            <a href="https://t.me/nasheauto" class="btn btn-telegram btn-glow" onclick="gtag('event', 'telegram_channel')">📢 Телеграм канал</a>
            
            <a href="https://t.me/nasheauto_ua" class="btn btn-telegram btn-glow" onclick="gtag('event', 'telegram_manager')">💬 Написати менеджеру в Телеграм</a>
            
            <a href="tel:+380637667788" class="btn btn-call btn-glow" onclick="gtag('event', 'phone_call')">📞 Подзвонити: (063) 766-77-88</a>
            
            <a href="viber://chat?number=%2B380637667788" class="btn btn-viber btn-glow" onclick="gtag('event', 'viber')">✉️ Написати у Вайбер</a>
            
            <a href="https://maps.app.goo.gl/y6iyE5VquvzRgzM96" class="btn btn-map btn-glow" onclick="gtag('event', 'google_maps')">📍 Побудувати маршрут (Google Maps)</a>
        </div>

        <div class="footer animate delay-4">
            © 2026 НАШЕ АВТО. Всі права захищено.
        </div>
        
    </div>
</body>
</html>
